<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Como usar a conciliação · Empresa Demo</title>
  <style>
    @page{size:A4;margin:16mm 15mm}
    :root{color-scheme:light}
    body{font:11pt/1.5 "Segoe UI",system-ui,sans-serif;color:#1d2a30;background:#fff;margin:0 auto;max-width:820px;padding:16px}
    h1{font-size:20pt;margin:0 0 4px} h2{font-size:13.5pt;margin:0 0 6px;padding-top:4px;border-top:2px solid #2B4C7E}
    h3{font-size:11.5pt;margin:10px 0 4px} p,li,dd{margin:3px 0}
    .capa{border-bottom:1px solid #d6dbde;margin-bottom:14px;padding-bottom:8px}
    .secundario{color:#55636a;font-size:10pt}
    .ajuda-bloco{break-inside:auto;margin:0 0 14px}
    .ajuda-bloco h2,.ajuda-bloco h3{break-after:avoid}
    .ajuda-sumario{background:#f3f5f7;border-radius:8px;padding:8px 12px;margin-bottom:14px}
    .ajuda-sumario ul{columns:2;column-gap:28px;margin:4px 0 0;padding-left:18px}
    .ajuda-sumario a{color:inherit;text-decoration:none}
    .passos{counter-reset:p;list-style:none;padding-left:0}
    .passos>li{counter-increment:p;position:relative;padding-left:26px}
    .passos>li::before{content:counter(p);position:absolute;left:0;top:2px;width:18px;height:18px;border-radius:50%;
      background:#E3E9F4;color:#2B4C7E;font-size:8.5pt;font-weight:700;text-align:center;line-height:18px}
    table{width:100%;border-collapse:collapse} td{padding:4px 6px;border-top:1px solid #e3e7ea;vertical-align:top}
    td:first-child{white-space:nowrap;width:1%}
    tr{break-inside:avoid}
    .pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:9pt;font-weight:600;white-space:nowrap}
    .st-ok{background:#E2EFEA;color:#17573F} .st-ressalva{background:#FBEFD9;color:#8A4B00}
    .st-semform{background:#FBE4DC;color:#A3361A} .st-info{background:#E3E9F4;color:#2B4C7E}
    .st-neutro{background:#ECEDEA;color:#4A535C} .st-laranja{background:#FDE6D2;color:#B04A00}
    code{font-size:9.5pt;background:#f3f5f7;padding:0 4px;border-radius:4px}
    .ajuda-faq dt{font-weight:600;margin-top:8px} .ajuda-faq dd{margin-left:0}
    .imprimir{float:right;font:inherit;padding:6px 12px;border-radius:8px;border:1px solid #2B4C7E;background:#2B4C7E;color:#fff;cursor:pointer}
    @media print{.imprimir{display:none} body{padding:0}}
  </style>
</head>
<body>
  <div class="capa">
    {% if not estatico %}<button class="imprimir" onclick="window.print()">Imprimir / salvar PDF</button>{% endif %}
    <h1>Como usar a conciliação de cartão</h1>
    <div class="secundario">Empresa Demo · guia prático para o financeiro e para os representantes · versão {{ versao }}</div>
  </div>
  {% include "conciliacao/_ajuda_conteudo.html" %}
</body>
</html>
