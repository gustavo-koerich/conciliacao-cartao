<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ titulo }} · Empresa Demo</title>
  <style>
    :root{color-scheme:light dark;--fundo:#f3f5f9;--cartao:#fff;--borda:#d8dde8;--texto:#1c2850;--sec:#4a5470}
    @media (prefers-color-scheme: dark){:root{--fundo:#11152a;--cartao:#1a2038;--borda:#2e3756;--texto:#e6eaf6;--sec:#b8c0da}}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--fundo);color:var(--texto);
         font-family:system-ui,"Segoe UI",sans-serif;padding:16px}
    div{max-width:420px;background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:24px;text-align:center}
    h1{font-size:1.25rem;margin:0 0 8px} p{color:var(--sec);margin:0}
  </style>
</head>
<body><div><h1>{{ titulo }}</h1><p>{{ texto }}</p></div></body>
</html>
